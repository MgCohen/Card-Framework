<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="rulebook-token" content="__TOKEN__">
<title>Rulebook</title>
<style>
:root {
  --bg: #f5f6f9; --panel: #ffffff; --ink: #1d2232; --muted: #626a7e; --faint: #8a91a3; --line: #e1e4eb; --soft: #f0f2f6; --hover: #e9ecf3;
  --accent: #3b52d6; --accent-soft: #e7eafb;
  --pass: #138a5c; --fail: #c73a4f; --warn: #b8770a; --plan: #7c52cc; --none: #a4aab8;
  --code: #f3f4f8;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #13151c; --panel: #1b1e28; --ink: #e9ebf2; --muted: #a0a7b8; --faint: #7b8295; --line: #2c313f; --soft: #222634; --hover: #2a2f3e;
  --accent: #8a9bff; --accent-soft: #283058;
  --pass: #4fd29a; --fail: #ff8091; --warn: #f2b65c; --plan: #bb92f7; --none: #5d6476; --code: #0f1117;
  color-scheme: dark } }
* { box-sizing: border-box }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans) }
button, input, select, textarea { font: inherit; color: inherit }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 13px; cursor: pointer }
button:hover:not(:disabled) { border-color: var(--accent) }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff }
button.ghost { border-color: transparent; background: transparent; color: var(--muted) }
button.ghost:hover:not(:disabled) { background: var(--hover); color: var(--ink) }
button.danger { color: var(--fail) }
button:disabled { opacity: .45; cursor: default }
input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; width: 100% }
input[type=checkbox] { width: auto }
textarea { resize: vertical; line-height: 1.5 }
textarea.code, .mono, code { font-family: var(--mono); font-size: 13px }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }

header { display: flex; align-items: center; gap: 18px; padding: 0 24px; height: 58px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5 }
header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em }
nav.top { display: flex; gap: 2px; height: 100% }
nav.top button { border: none; border-radius: 0; background: none; padding: 0 14px; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500 }
nav.top button.on { color: var(--ink); border-bottom-color: var(--accent) }
.spacer { flex: 1 }
.gate-state { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px }

main { padding: 22px 24px 120px; max-width: 1440px; margin: 0 auto }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0 }
.pad { padding: 18px 20px }
h2 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -.01em }
h3 { font-size: 13px; font-weight: 650; color: var(--muted); margin: 22px 0 10px; letter-spacing: .02em }
.muted { color: var(--muted) } .faint { color: var(--faint) }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.between { justify-content: space-between }
table { border-collapse: collapse; width: 100% }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: 12.5px; color: var(--muted); font-weight: 600 }
.scroll { overflow-x: auto }

.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; background: var(--none) }
.dot.pass { background: var(--pass) } .dot.fail { background: var(--fail) } .dot.warn { background: var(--warn) } .dot.plan { background: var(--plan) } .dot.run { background: var(--warn); animation: pulse 1s infinite alternate }
@keyframes pulse { to { opacity: .3 } }
@media (prefers-reduced-motion: reduce) { .dot.run { animation: none } }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap }
.badge.pass { color: var(--pass) } .badge.fail { color: var(--fail) } .badge.warn { color: var(--warn) } .badge.plan { color: var(--plan) } .badge.agent { color: var(--plan) }
a.link { color: var(--accent); text-decoration: none; cursor: pointer } a.link:hover { text-decoration: underline }

.rules { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: start }
.rules > .panel:first-child, .runs > .panel:first-child { position: sticky; top: 76px }
.booktabs { display: flex; gap: 4px; padding: 10px 10px 0; flex-wrap: wrap }
.booktabs button { border: none; background: none; padding: 5px 9px; border-radius: 7px; color: var(--muted); font-size: 14px }
.booktabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.booktabs .count { color: var(--faint); font-size: 12.5px; margin-left: 4px }
.listtools { padding: 10px; display: flex; gap: 8px }
.listtools button { white-space: nowrap }
.list { padding: 0 6px 10px; max-height: calc(100vh - 230px); overflow: auto }
.item { display: grid; grid-template-columns: 12px 72px 1fr; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; cursor: pointer }
.item:hover { background: var(--hover) }
.item.on { background: var(--accent-soft) }
.item .id { font-family: var(--mono); font-size: 12.5px; color: var(--muted) }
.item .t { font-size: 14.5px; line-height: 1.35 }
.bookdesc { padding: 0 16px 6px; color: var(--faint); font-size: 13px }

.editor-head { padding: 18px 22px 0; display: grid; gap: 8px }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 16px; margin-top: 8px }
.subtabs button { border: none; border-radius: 0; background: none; padding: 9px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px }
.subtabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600 }
.editor-body { padding: 18px 22px 22px }
.section { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px }
.section > .title { font-weight: 650; font-size: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px }
.form { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px 14px; align-items: start }
.form > label { padding-top: 7px; color: var(--muted); font-size: 14px }
.help { color: var(--faint); font-size: 12.5px; margin-top: 3px }
.sub { border-left: 2px solid var(--line); padding-left: 12px; display: grid; gap: 10px }
.judge { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; background: var(--soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px }
.judge b { color: var(--muted); font-weight: 600 }
.savebar { position: sticky; bottom: 41px; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 22px; display: flex; gap: 10px; align-items: center; border-radius: 0 0 12px 12px }
.errors { color: var(--fail); white-space: pre-wrap; font-size: 13.5px }
.finding { border-left: 3px solid var(--fail); background: var(--soft); padding: 8px 12px; border-radius: 0 8px 8px 0; margin-bottom: 8px }
.finding.warn { border-color: var(--warn) } .finding.ex { border-color: var(--none) }
.finding .t { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere }
.fix { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin-top: 10px }
.timeline { display: flex; gap: 4px; flex-wrap: wrap }
.timeline span { width: 16px; height: 22px; border-radius: 4px; background: var(--none) }
.timeline span.pass { background: var(--pass) } .timeline span.fail { background: var(--fail) } .timeline span.warn { background: var(--warn) }

.flow { display: flex; align-items: center; overflow-x: auto; padding: 22px 20px }
.node { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 150px; background: var(--panel); cursor: pointer }
.node.optional { border-style: dashed }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.node .k { font-size: 12px; color: var(--faint) }
.node .n { font-weight: 600 }
.arrow { flex: none; width: 34px; height: 2px; background: var(--line); position: relative }
.arrow::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left-color: var(--line) }
.stagecard { display: grid; grid-template-columns: 24px 1fr; gap: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--panel) }
.stagecard.sel { border-color: var(--accent) }
.stagecard.dragging { opacity: .4 }
.stagecard.over { box-shadow: 0 -3px 0 var(--accent) }
.handle { cursor: grab; color: var(--faint); user-select: none; padding-top: 6px; font-size: 18px; line-height: 1 }
.stagegrid { display: grid; grid-template-columns: 140px 1fr 170px; gap: 10px; align-items: center }

details.group { border-bottom: 1px solid var(--line) }
details.group > summary { list-style: none; cursor: pointer; padding: 9px 4px; display: flex; gap: 10px; align-items: center }
details.group > summary::-webkit-details-marker { display: none }
details.group > summary::before { content: "▸"; color: var(--faint); width: 12px; transition: transform .1s }
details.group[open] > summary::before { transform: rotate(90deg) }
details.group details.group { margin-left: 18px; border: none }
.testrow { display: grid; grid-template-columns: 12px 1fr auto 60px; gap: 10px; align-items: center; padding: 5px 4px 5px 52px; font-size: 14px }
.testrow:hover { background: var(--hover) }

.runs { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: start }
.runitem { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; align-items: center }
.runitem:hover { background: var(--hover) } .runitem.on { background: var(--accent-soft) }
.chart { padding: 14px 20px 6px }
.chart svg { width: 100%; height: 120px; display: block }

#runbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); z-index: 10 }
#runbar .head { display: flex; gap: 10px; align-items: center; padding: 9px 24px; cursor: pointer; font-size: 14px }
#runbar pre { margin: 0; max-height: 280px; overflow: auto; padding: 10px 24px; background: var(--code); font: 12.5px/1.5 var(--mono); border-top: 1px solid var(--line) }
#runbar.closed pre { display: none }
.toast { position: fixed; right: 24px; top: 72px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 10px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.14); z-index: 20 }
.empty { padding: 40px 20px; text-align: center; color: var(--muted) }
@media (max-width: 900px) { .rules, .runs { grid-template-columns: 1fr } .list { max-height: none } .form { grid-template-columns: 1fr } .stagegrid { grid-template-columns: 1fr } }
</style>
</head>
<body>
<header>
  <h1>Rulebook</h1>
  <nav class="top" id="tabs"></nav>
  <span class="spacer"></span>
  <span class="gate-state" id="gateState"></span>
  <button class="primary" id="runDefault">Run gate</button>
  <select id="runMore" style="width:auto" aria-label="More run options">
    <option value="">More runs…</option>
    <option value="playmode">Gate + PlayMode</option>
    <option value="review">Gate + agent review</option>
    <option value="onlyreview">Agent review only</option>
    <option value="all">All stages</option>
  </select>
</header>
<main id="view"></main>
<div id="runbar" class="closed">
  <div class="head" id="runHead"><span class="dot" id="runDot"></span><b id="runTitle">No run yet</b><span class="muted" id="runMeta"></span><span class="spacer"></span><button id="runStop" class="danger" hidden>Stop</button><span class="faint">Output</span></div>
  <pre id="runOut"></pre>
</div>

<script>
const TOKEN = document.querySelector('meta[name="rulebook-token"]').content;
const S = {
  tab: 'rules', state: null, draft: null, gateDraft: null,
  book: null, ruleId: null, ruleTab: 'definition', rawParams: false, search: '',
  stageSel: null, testQ: '', runSel: null, runCache: {},
};
const $ = (q, el = document) => el.querySelector(q);
const $$ = (q, el = document) => [...el.querySelectorAll(q)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = v => JSON.parse(JSON.stringify(v));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const when = iso => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { 'X-Rulebook-Token': TOKEN, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || (data.errors || []).join('\n') || res.statusText), { data });
  return data;
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2600); }

async function load() {
  S.state = await api('GET', '/api/state');
  S.draft = clone(S.state.rulebook);
  S.gateDraft = clone(S.state.gate);
  S.book ||= S.draft.books[0]?.id;
  if (!S.draft.rules.some(r => r.id === S.ruleId)) S.ruleId = S.draft.rules.find(r => r.book === S.book)?.id;
  if (!S.runSel) S.runSel = S.state.history[0]?.id;
  render(); renderRun(S.state.run);
}

// --- derived ----------------------------------------------------------------------------------

const KINDS = () => S.state.kinds.kinds;
const JUDGES = () => S.state.kinds.judges;
const judgeOf = rule => KINDS()[rule.check.kind]?.judge || 'static';

function lastRuleRun(id) {
  for (const run of S.state.history) { const r = run.rules.find(x => x.rule === id); if (r) return { run, passed: r.passed }; }
  return null;
}
function linkedTests(id) { return (S.state.catalog?.tests || []).filter(t => (t.rules || []).includes(id) && t.assembly !== 'Tools.Rulebook.Tests'); }
function ruleState(rule) {
  if (rule.status === 'planned') return 'plan';
  const last = lastRuleRun(rule.id);
  const failedTests = linkedTests(rule.id).some(t => t.result === 'Failed');
  if (!last && !failedTests) return 'none';
  if ((last && !last.passed) || failedTests) return rule.severity === 'advisory' ? 'warn' : 'fail';
  return 'pass';
}
const STATE_TEXT = { pass: 'Passing', fail: 'Failing', warn: 'Warning', plan: 'Planned', none: 'Not run' };

// --- shell ------------------------------------------------------------------------------------

const TABS = { rules: 'Rules', template: 'Template', gate: 'Gate', tests: 'Tests', runs: 'Runs' };
function render() {
  $('#tabs').innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${v}</button>`).join('');
  const last = S.state.history[0];
  $('#gateState').innerHTML = last ? `<span class="dot ${RES(last.result)}"></span>Last gate ${esc(last.result)} · ${when(last.startedAt)}` : 'No gate run yet';
  ({ rules: renderRules, template: renderTemplate, gate: renderGate, tests: renderTests, runs: renderRuns })[S.tab]();
}
$('#tabs').addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) { S.tab = t.dataset.tab; render(); } });
document.addEventListener('click', e => {
  const g = e.target.closest('[data-goto]'); if (!g) return;
  e.preventDefault(); const rule = S.draft.rules.find(r => r.id === g.dataset.goto); if (!rule) return;
  S.tab = 'rules'; S.book = rule.book; S.ruleId = rule.id; S.ruleTab = 'definition'; render();
});
const ruleLink = id => `<a class="link mono" data-goto="${esc(id)}">${esc(id)}</a>`;
const RES = r => ({ PASS: 'pass', FAIL: 'fail', WARN: 'warn', ERROR: 'fail' })[r] || '';

// --- rules ------------------------------------------------------------------------------------

function renderRules() {
  const d = S.draft;
  const rules = d.rules.filter(r => r.book === S.book && (!S.search || (r.id + ' ' + r.title).toLowerCase().includes(S.search.toLowerCase())));
  const book = d.books.find(b => b.id === S.book);
  const rule = d.rules.find(r => r.id === S.ruleId);
  $('#view').innerHTML = `
    <div class="rules">
      <div class="panel">
        <div class="booktabs">${d.books.map(b => `<button data-book="${esc(b.id)}" class="${b.id === S.book ? 'on' : ''}">${esc(b.title)}<span class="count">${d.rules.filter(r => r.book === b.id).length}</span></button>`).join('')}</div>
        <div class="listtools"><input id="ruleSearch" placeholder="Search rules" value="${esc(S.search)}"><button id="newRule" title="Add a rule to this book">+ Rule</button></div>
        ${book?.description ? `<div class="bookdesc">${esc(book.description)}</div>` : ''}
        <div class="list">${rules.map(r => `
          <div class="item ${r.id === S.ruleId ? 'on' : ''}" data-rule="${esc(r.id)}" title="${STATE_TEXT[ruleState(r)]}">
            <span class="dot ${ruleState(r)}"></span><span class="id">${esc(r.id)}</span><span class="t">${esc(r.title)}</span>
          </div>`).join('') || '<div class="empty">No rules in this book.</div>'}</div>
      </div>
      <div class="panel">${rule ? ruleEditor(rule) : '<div class="empty">Select a rule, or add one with + Rule.</div>'}</div>
    </div>`;
  const s = $('#ruleSearch');
  s.addEventListener('input', () => { S.search = s.value; const pos = s.selectionStart; renderRules(); const n = $('#ruleSearch'); n.focus(); n.setSelectionRange(pos, pos); });
}

function ruleEditor(rule) {
  const st = ruleState(rule), j = judgeOf(rule), judge = JUDGES()[j];
  const dirty = !same(S.draft, S.state.rulebook);
  const isNew = !S.state.rulebook.rules.some(r => r.id === rule.id);
  const body = { definition: ruleDefinition, result: ruleResultView, tests: ruleTestsView, history: ruleHistoryView }[S.ruleTab](rule);
  return `
    <div class="editor-head">
      <div class="row between"><h2><span class="mono faint" style="font-size:15px">${esc(rule.id)}</span> ${esc(rule.title)}</h2>
        <div class="row"><span class="badge ${st}"><span class="dot ${st}"></span>${STATE_TEXT[st]}</span>
          <span class="badge ${j === 'agent' ? 'agent' : ''}">${esc(judge?.title || j)}${judge && !judge.deterministic ? ' · non-deterministic' : ''}</span>
          <span class="badge">${esc(rule.severity || 'blocking')}</span></div></div>
    </div>
    <div class="subtabs">${['definition', 'result', 'tests', 'history'].map(t => `<button data-subtab="${t}" class="${S.ruleTab === t ? 'on' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div>
    <div class="editor-body">${body}</div>
    <div class="savebar">
      <button class="primary" id="save" ${dirty ? '' : 'disabled'}>Save rulebook</button>
      <button id="revert" ${dirty ? '' : 'disabled'}>Revert</button>
      <button id="runRule" ${dirty || isNew || rule.status === 'planned' ? 'disabled' : ''} title="${dirty ? 'Save first' : 'Run this rule and its linked tests'}">Run this rule</button>
      <span class="errors" id="saveErr"></span><span class="spacer"></span>
      <button class="danger ghost" id="delRule">Delete rule</button>
    </div>`;
}

function ruleDefinition(rule) {
  const kinds = KINDS(), desc = kinds[rule.check.kind] || { params: [] }, judge = JUDGES()[desc.judge] || {};
  const isNew = !S.state.rulebook.rules.some(r => r.id === rule.id);
  const params = rule.check.params || {};
  const known = new Set((desc.params || []).map(p => p.name));
  const unknown = Object.keys(params).filter(k => !known.has(k));
  const ex = rule.exceptions || [];
  const fields = S.draft.fields || [];
  return `
    <div class="section"><div class="title">Rule</div><div class="form">
      <label>Id</label><input id="f-id" value="${esc(rule.id)}" ${isNew ? '' : 'disabled'}>
      <label>Book</label><select id="f-book">${S.draft.books.map(b => `<option value="${esc(b.id)}" ${b.id === rule.book ? 'selected' : ''}>${esc(b.title)}</option>`).join('')}</select>
      <label>Title</label><input data-f="title" value="${esc(rule.title)}">
      <label>Statement</label><textarea data-f="rule" rows="2">${esc(rule.rule)}</textarea>
      <label>Why</label><textarea data-f="why" rows="2">${esc(rule.why)}</textarea>
      <label>Fix</label><textarea data-f="fix" rows="2">${esc(rule.fix)}</textarea>
      <label>Status</label><select data-f="status"><option ${rule.status === 'enforced' ? 'selected' : ''}>enforced</option><option ${rule.status === 'planned' ? 'selected' : ''}>planned</option></select>
      <label>Severity</label><div><select data-f="severity"><option ${rule.severity !== 'advisory' ? 'selected' : ''}>blocking</option><option ${rule.severity === 'advisory' ? 'selected' : ''}>advisory</option></select><div class="help">Blocking fails the gate. Advisory reports a warning.</div></div>
    </div></div>

    <div class="section"><div class="title"><span>Judge</span><button class="ghost" id="rawToggle">${S.rawParams ? 'Form view' : 'Raw JSON'}</button></div>
      <div class="judge"><b>Judged by</b><span>${esc(judge.title || desc.judge)} · ${judge.deterministic ? 'deterministic' : '<span style="color:var(--plan)">non-deterministic</span>'}</span>
        <b>Runs in</b><span>${esc(judge.runsIn || '')}</span><b>How</b><span>${esc(judge.description || '')}</span></div>
      <div class="form">
        <label>Check kind</label><div><select id="f-kind">${Object.keys(kinds).map(k => `<option ${k === rule.check.kind ? 'selected' : ''}>${k}</option>`).join('')}</select><div class="help">${esc(desc.description || '')}</div></div>
        ${S.rawParams
          ? `<label>Params</label><div><textarea class="code" id="f-raw" rows="14">${esc(JSON.stringify(params, null, 2))}</textarea><div class="errors" id="rawErr"></div></div>`
          : (desc.params || []).map(p => paramField(p, params[p.name], p.name)).join('') +
            (unknown.length ? `<label>Other</label><div class="help">Not in the kind's descriptor: ${unknown.map(esc).join(', ')}. Edit them in Raw JSON.</div>` : '')}
      </div></div>

    <div class="section"><div class="title"><span>Exceptions</span><button id="addEx">+ Exception</button></div>
      ${ex.length ? `<div class="scroll"><table><thead><tr><th>Target (glob)</th><th>Reason</th><th>Until</th><th></th></tr></thead><tbody>${ex.map((e, i) => `
        <tr><td><input class="mono" data-ex="${i}" data-k="target" value="${esc(e.target)}"></td><td><input data-ex="${i}" data-k="reason" value="${esc(e.reason)}"></td>
        <td><input data-ex="${i}" data-k="until" value="${esc(e.until)}"></td><td><button class="ghost danger" data-exdel="${i}" title="Remove">✕</button></td></tr>`).join('')}</tbody></table></div>`
        : '<div class="muted">No known violations are tolerated.</div>'}</div>

    ${fields.length ? `<div class="section"><div class="title"><span>Custom fields</span><a class="link" data-tab-go="template">Edit template</a></div><div class="form">
      ${fields.map(f => customField(f, (rule.extra || {})[f.name])).join('')}</div></div>` : ''}`;
}

function paramField(p, value, path) {
  const label = `<label>${esc(p.name)}${p.required ? ' *' : ''}</label>`;
  const help = p.help ? `<div class="help">${esc(p.help)}</div>` : '';
  const attrs = `data-p="${esc(path)}" data-type="${p.type}"`;
  switch (p.type) {
    case 'text': return `${label}<div><textarea ${attrs} rows="4">${esc(value ?? '')}</textarea>${help}</div>`;
    case 'number': return `${label}<div><input type="number" ${attrs} value="${esc(value ?? '')}">${help}</div>`;
    case 'bool': return `${label}<div><input type="checkbox" ${attrs} ${value ? 'checked' : ''}>${help}</div>`;
    case 'enum': return `${label}<div><select ${attrs}><option value=""></option>${p.options.map(o => `<option ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>${help}</div>`;
    case 'list': return `${label}<div><textarea class="code" ${attrs} rows="${Math.max(2, (value || []).length + 1)}" placeholder="One per line">${esc((value || []).join('\n'))}</textarea>${help}</div>`;
    case 'table': {
      const rows = Object.entries(value || {});
      return `${label}<div><table data-table="${esc(path)}"><thead><tr><th style="width:38%">Key</th><th>Values (comma separated)</th><th></th></tr></thead><tbody>
        ${rows.map(([k, v], i) => `<tr><td><input class="mono" data-trow="${i}" data-tk value="${esc(k)}"></td><td><input class="mono" data-trow="${i}" data-tv value="${esc((v || []).join(', '))}"></td><td><button class="ghost danger" data-tdel="${esc(path)}" data-i="${i}">✕</button></td></tr>`).join('')}
        </tbody></table><button data-tadd="${esc(path)}" style="margin-top:6px">+ Row</button>${help}</div>`;
    }
    case 'object': return `${label}<div class="sub">${(p.fields || []).map(f => `<div class="form" style="grid-template-columns:110px 1fr">${paramField(f, (value || {})[f.name], path + '.' + f.name)}</div>`).join('')}${help}</div>`;
    default: return `${label}<div><input ${attrs} value="${esc(value ?? '')}">${help}</div>`;
  }
}

function customField(f, value) {
  const label = `<label>${esc(f.label || f.name)}${f.required ? ' *' : ''}</label>`;
  const help = f.help ? `<div class="help">${esc(f.help)}</div>` : '';
  const attrs = `data-x="${esc(f.name)}" data-type="${f.type}"`;
  if (f.type === 'text') return `${label}<div><textarea ${attrs} rows="3">${esc(value ?? '')}</textarea>${help}</div>`;
  if (f.type === 'bool') return `${label}<div><input type="checkbox" ${attrs} ${value ? 'checked' : ''}>${help}</div>`;
  if (f.type === 'enum') return `${label}<div><select ${attrs}><option value=""></option>${(f.options || []).map(o => `<option ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>${help}</div>`;
  if (f.type === 'list') return `${label}<div><input ${attrs} value="${esc((value || []).join(', '))}" placeholder="Comma separated">${help}</div>`;
  return `${label}<div><input ${attrs} value="${esc(value ?? '')}">${help}</div>`;
}

function setPath(obj, path, value) {
  const keys = path.split('.'); let o = obj;
  keys.slice(0, -1).forEach(k => { o = (o[k] ||= {}); });
  const last = keys[keys.length - 1];
  if (value === undefined || value === '' || (Array.isArray(value) && !value.length)) delete o[last]; else o[last] = value;
}
function readInput(el) {
  const t = el.dataset.type;
  if (t === 'bool') return el.checked || undefined;
  if (t === 'number') return el.value === '' ? undefined : Number(el.value);
  if (t === 'list') return el.value.split(el.tagName === 'TEXTAREA' ? '\n' : ',').map(s => s.trim()).filter(Boolean);
  return el.value;
}

function ruleResultView(rule) {
  const last = lastRuleRun(rule.id);
  if (!last) return '<div class="empty">This rule has not run yet. Use Run this rule.</div>';
  const rep = S.runCache[last.run.id];
  if (!rep) { fetchRun(last.run.id).then(() => S.tab === 'rules' && renderRules()); return '<div class="empty">Loading…</div>'; }
  const r = (rep.rules || []).find(x => x.rule === rule.id) || {};
  const j = r.judge;
  const cls = rule.severity === 'advisory' ? 'warn' : '';
  return `
    <div class="row between"><div class="muted">From the run on ${when(last.run.startedAt)}</div><a class="link" data-run="${last.run.id}">Open run</a></div>
    ${j ? `<div class="judge" style="margin-top:12px"><b>Agent</b><span>${esc(j.model)} · ${j.turns ?? '?'} turns · ${j.durationSec ?? '?'}s${j.costUsd != null ? ' · $' + j.costUsd.toFixed(3) : ''}</span><b>Summary</b><span>${esc(j.summary || '')}</span></div>` : ''}
    ${r.error ? `<h3>Check error</h3><div class="errors">${esc(r.error)}</div>` : ''}
    <h3>Violations (${(r.violations || []).length})</h3>
    ${(r.violations || []).map(v => finding(v, cls)).join('') || '<div class="muted">None.</div>'}
    ${(r.violations || []).length ? `<div class="fix"><b>Fix</b> ${esc(rule.fix)}</div>` : ''}
    ${(r.exempted || []).length ? `<h3>Tolerated by exceptions (${r.exempted.length})</h3>${r.exempted.map(v => finding(v, 'ex')).join('')}` : ''}
    ${(r.staleExceptions || []).length ? `<h3>Stale exceptions</h3>${r.staleExceptions.map(e => finding({ target: e.target, detail: 'No longer matches a violation. Remove it.' }, '')).join('')}` : ''}`;
}
const finding = (v, cls) => `<div class="finding ${cls}"><div class="t">${esc(v.target)}</div><div>${esc(v.detail)}</div>${v.location ? `<div class="mono faint">${esc(v.location)}</div>` : ''}</div>`;

function ruleTestsView(rule) {
  const tests = linkedTests(rule.id);
  const own = (S.state.catalog?.tests || []).find(t => t.assembly === 'Tools.Rulebook.Tests' && (t.rules || []).includes(rule.id));
  const dot = t => t.result === 'Passed' ? 'pass' : t.result === 'Failed' ? 'fail' : '';
  return `
    ${own ? `<h3 style="margin-top:0">Rule test</h3><div class="testrow" style="padding-left:4px"><span class="dot ${dot(own)}"></span><span class="mono">${esc(own.fullname)}</span><span></span><span class="faint">${Math.round(own.duration * 1000)} ms</span></div>` : ''}
    <h3 ${own ? '' : 'style="margin-top:0"'}>Linked tests (${tests.length})</h3>
    ${tests.length ? tests.map(t => `<div class="testrow" style="padding-left:4px"><span class="dot ${dot(t)}"></span><span class="mono">${esc(t.fullname)}</span><span class="faint">${t.tier}</span><span class="faint">${Math.round(t.duration * 1000)} ms</span></div>`).join('')
      : `<div class="muted">No test carries [Rule("${esc(rule.id)}")].${rule.check.kind === 'attached' ? ' This rule fails until one does.' : ''}</div>`}`;
}

function ruleHistoryView(rule) {
  const runs = S.state.history.filter(r => r.rules.some(x => x.rule === rule.id));
  if (!runs.length) return '<div class="empty">No runs include this rule yet.</div>';
  const mark = run => run.rules.find(x => x.rule === rule.id).passed ? 'pass' : rule.severity === 'advisory' ? 'warn' : 'fail';
  return `<div class="timeline">${runs.slice().reverse().map(r => `<span class="${mark(r)}" title="${when(r.startedAt)}"></span>`).join('')}</div>
    <div class="help" style="margin:6px 0 14px">Oldest to newest. ${runs.length} run(s).</div>
    <table><thead><tr><th>Run</th><th>Result</th><th></th></tr></thead><tbody>${runs.map(r => `<tr><td>${when(r.startedAt)}</td><td><span class="badge ${mark(r)}">${STATE_TEXT[mark(r)]}</span></td><td><a class="link" data-run="${r.id}">Open run</a></td></tr>`).join('')}</tbody></table>`;
}

const currentRule = () => S.draft.rules.find(r => r.id === S.ruleId);

function onRulesInput(e) {
  const rule = currentRule(); if (!rule) return;
  const t = e.target;
  if (t.dataset.f) rule[t.dataset.f] = t.value;
  if (t.dataset.p) setPath(rule.check.params ||= {}, t.dataset.p, readInput(t));
  if (t.dataset.x) { rule.extra ||= {}; setPath(rule.extra, t.dataset.x, readInput(t)); if (!Object.keys(rule.extra).length) delete rule.extra; }
  if (t.dataset.ex !== undefined) rule.exceptions[+t.dataset.ex][t.dataset.k] = t.value;
  if (t.dataset.trow !== undefined) {
    const table = t.closest('[data-table]'); const obj = {};
    $$('tbody tr', table).forEach(tr => { const k = $('[data-tk]', tr).value.trim(); if (k) obj[k] = $('[data-tv]', tr).value.split(',').map(s => s.trim()).filter(Boolean); });
    setPath(rule.check.params, table.dataset.table, obj);
  }
  if (t.id === 'f-raw') { try { rule.check.params = JSON.parse(t.value || '{}'); $('#rawErr').textContent = ''; } catch (err) { $('#rawErr').textContent = 'Not valid JSON: ' + err.message; } }
  refreshSave();
}
function refreshSave() {
  const dirty = !same(S.draft, S.state.rulebook);
  ['save', 'revert'].forEach(id => { const b = $('#' + id); if (b) b.disabled = !dirty; });
  const run = $('#runRule'); if (run && dirty) run.disabled = true;
}

async function onRulesClick(e) {
  const t = e.target, rule = currentRule();
  const item = t.closest('[data-rule]'); if (item) { S.ruleId = item.dataset.rule; return renderRules(); }
  const bk = t.closest('[data-book]'); if (bk) { S.book = bk.dataset.book; S.ruleId = S.draft.rules.find(r => r.book === S.book)?.id; return renderRules(); }
  if (t.dataset.subtab) { S.ruleTab = t.dataset.subtab; return renderRules(); }
  if (t.dataset.tabGo) { S.tab = t.dataset.tabGo; return render(); }
  if (t.dataset.run) { S.tab = 'runs'; S.runSel = t.dataset.run; return render(); }
  if (t.id === 'newRule') {
    const prefix = (S.draft.rules.find(r => r.book === S.book)?.id.split('-')[0]) || S.book.toUpperCase().slice(0, 4);
    let n = 1; while (S.draft.rules.some(r => r.id === `${prefix}-${String(n).padStart(2, '0')}`)) n++;
    const id = `${prefix}-${String(n).padStart(2, '0')}`;
    S.draft.rules.push({ id, book: S.book, title: 'New rule', rule: '', why: '', fix: '', status: 'planned', severity: 'blocking', check: { kind: 'attached' } });
    S.ruleId = id; S.ruleTab = 'definition'; return renderRules();
  }
  if (!rule) return;
  if (t.id === 'rawToggle') { S.rawParams = !S.rawParams; return renderRules(); }
  if (t.id === 'addEx') { (rule.exceptions ||= []).push({ target: '', reason: '', until: '' }); return renderRules(); }
  if (t.dataset.exdel !== undefined) { rule.exceptions.splice(+t.dataset.exdel, 1); if (!rule.exceptions.length) delete rule.exceptions; return renderRules(); }
  if (t.dataset.tadd) { const tbl = $(`[data-table="${t.dataset.tadd}"] tbody`); const i = tbl.children.length; tbl.insertAdjacentHTML('beforeend', `<tr><td><input class="mono" data-trow="${i}" data-tk></td><td><input class="mono" data-trow="${i}" data-tv></td><td></td></tr>`); return; }
  if (t.dataset.tdel) { const obj = { ...(rule.check.params[t.dataset.tdel] || {}) }; delete obj[Object.keys(obj)[+t.dataset.i]]; setPath(rule.check.params, t.dataset.tdel, obj); return renderRules(); }
  if (t.id === 'revert') { S.draft = clone(S.state.rulebook); if (!currentRule()) S.ruleId = S.draft.rules.find(r => r.book === S.book)?.id; return renderRules(); }
  if (t.id === 'delRule') {
    if (!t.dataset.confirm) { t.dataset.confirm = '1'; t.textContent = 'Click again to delete'; return; }
    S.draft.rules = S.draft.rules.filter(r => r.id !== S.ruleId); S.ruleId = S.draft.rules.find(r => r.book === S.book)?.id; return renderRules();
  }
  if (t.id === 'save') { try { await api('PUT', '/api/rulebook', S.draft); toast('Rulebook saved'); await load(); } catch (err) { $('#saveErr').textContent = err.message; } }
  if (t.id === 'runRule') startRun({ rule: rule.id });
}
function onRulesChange(e) {
  const rule = currentRule(); if (!rule) return;
  const t = e.target;
  if (t.id === 'f-book') { rule.book = t.value; S.book = t.value; return renderRules(); }
  if (t.id === 'f-id') { rule.id = t.value.trim(); S.ruleId = rule.id; return renderRules(); }
  if (t.id === 'f-kind') { rule.check = { kind: t.value }; if (KINDS()[t.value]?.params?.length) rule.check.params = {}; return renderRules(); }
  if (t.type === 'checkbox' || t.tagName === 'SELECT') { onRulesInput(e); return renderRules(); }
}

      <h3>Custom rule fields</h3>

        ${(d.fields || []).map((f, i) => `<tr><td><input class="mono" data-fd="${i}" data-k="name" value="${esc(f.name)}"></td><td><input data-fd="${i}" data-k="label" value="${esc(f.label || '')}"></td>
          <td><select data-fd="${i}" data-k="type">${['text', 'string', 'list', 'bool', 'enum'].map(t => `<option ${t === f.type ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
          <td><input data-fd="${i}" data-k="options" value="${esc((f.options || []).join(', '))}" ${f.type === 'enum' ? '' : 'disabled'}></td>

          <td><button class="ghost danger" data-fddel="${i}">✕</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">No custom fields.</td></tr>'}
      </tbody></table><button id="addField" style="margin-top:8px">+ Field</button>
    </div>
    <div class="savebar"><button class="primary" id="tSave" ${dirty ? '' : 'disabled'}>Save rulebook</button><button id="tRevert" ${dirty ? '' : 'disabled'}>Revert</button><span class="errors" id="tErr"></span></div></div>`;
}
function onTemplate(e) {
  const t = e.target, d = S.draft;
  if (t.dataset.bk !== undefined) d.books[+t.dataset.bk][t.dataset.k] = t.value;
  if (t.dataset.fd !== undefined) {
    const f = d.fields[+t.dataset.fd], k = t.dataset.k;
    if (k === 'required') { if (t.checked) f.required = true; else delete f.required; }
    else if (k === 'options') f.options = t.value.split(',').map(s => s.trim()).filter(Boolean);
    else f[k] = t.value;
    if (k === 'type' && t.value !== 'enum') delete f.options;
    if (e.type === 'change' && (k === 'type' || k === 'required')) return renderTemplate();
  }
  ['tSave', 'tRevert'].forEach(id => $('#' + id).disabled = same(d, S.state.rulebook));
}
async function onTemplateClick(e) {
  const t = e.target, d = S.draft;
  if (t.id === 'addBook') { d.books.push({ id: 'book-' + (d.books.length + 1), title: 'New book' }); return renderTemplate(); }
  if (t.dataset.bkdel !== undefined) { d.books.splice(+t.dataset.bkdel, 1); return renderTemplate(); }
  if (t.id === 'addField') { (d.fields ||= []).push({ name: 'field' + (d.fields.length + 1), label: 'New field', type: 'string' }); return renderTemplate(); }
  if (t.dataset.fddel !== undefined) { const name = d.fields[+t.dataset.fddel].name; d.fields.splice(+t.dataset.fddel, 1); d.rules.forEach(r => { if (r.extra) { delete r.extra[name]; if (!Object.keys(r.extra).length) delete r.extra; } }); return renderTemplate(); }
  if (t.id === 'tRevert') { S.draft = clone(S.state.rulebook); return renderTemplate(); }
  if (t.id === 'tSave') { try { await api('PUT', '/api/rulebook', d); toast('Rulebook saved'); await load(); } catch (err) { $('#tErr').textContent = err.message; } }
}

function renderGate() {

  $('#view').innerHTML = `

      <div class="flow">${g.stages.map((s, i) => `${i ? '<span class="arrow"></span>' : ''}
        <div class="node ${s.optional ? 'optional' : ''} ${S.stageSel === s.id ? 'sel' : ''}" data-node="${esc(s.id)}">

        <label>Timeout (s)</label><div><input id="g-timeout" type="number" min="60" value="${esc(g.timeoutSeconds || 1800)}"><div class="help">The most time one Unity launch may take.</div></div>
      </div></div>
      <h3>Stages</h3><div class="help" style="margin-bottom:10px">Drag to reorder. A test assembly belongs to the first stage of its kind whose patterns match it.</div>
      <div id="stageList">${g.stages.map((s, i) => `
        <div class="stagecard ${S.stageSel === s.id ? 'sel' : ''}" draggable="true" data-i="${i}">
          <span class="handle" title="Drag to reorder">⋮⋮</span>
          <div style="display:grid;gap:8px">
            <div class="stagegrid"><input class="mono" data-st="${i}" data-k="id" value="${esc(s.id)}" title="Id">
              <input data-st="${i}" data-k="title" value="${esc(s.title)}" title="Title">
              <select data-st="${i}" data-k="kind">${Object.keys(STAGE_KIND).map(k => `<option value="${k}" ${k === s.kind ? 'selected' : ''}>${STAGE_KIND[k]}</option>`).join('')}</select></div>
            ${s.kind === 'editmode' || s.kind === 'playmode' ? `<input class="mono" data-st="${i}" data-k="assemblies" value="${esc((s.assemblies || []).join(', '))}" placeholder="Assembly globs, comma separated">` : `<div class="help">${s.kind === 'review' ? 'Runs every enforced agent.review rule through headless claude -p.' : 'Reported from the Unity log of the first test run.'}</div>`}
            <div class="row"><label class="row" style="gap:6px"><input type="checkbox" data-st="${i}" data-k="default" ${s.optional ? '' : 'checked'}> Runs by default</label>
              <span class="spacer"></span><button class="ghost danger" data-del="${i}">Remove</button></div>
          </div></div>`).join('')}</div>
      <button id="addStage">+ Stage</button>
    </div>
    <div class="savebar"><button class="primary" id="saveGate" ${dirty ? '' : 'disabled'}>Save gate</button><button id="revertGate" ${dirty ? '' : 'disabled'}>Revert</button><span class="errors" id="gateErr"></span></div></div>`;
  wireDrag();
}
function wireDrag() {
  let from = null;
  $$('.stagecard').forEach(card => {
    card.addEventListener('dragstart', () => { from = +card.dataset.i; card.classList.add('dragging'); });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('over'); });
    card.addEventListener('dragleave', () => card.classList.remove('over'));
    card.addEventListener('drop', e => {
      e.preventDefault(); const to = +card.dataset.i; if (from === null || from === to) return;
      const [s] = S.gateDraft.stages.splice(from, 1); S.gateDraft.stages.splice(to, 0, s); renderGate();
    });
  });
}
function onGate(e) {
  const t = e.target, g = S.gateDraft;
  if (t.id === 'g-cat') { if (t.value) g.testCategory = t.value; else delete g.testCategory; }
  if (t.id === 'g-timeout') g.timeoutSeconds = Math.max(60, +t.value || 1800);
  if (t.dataset.st !== undefined) {
    const s = g.stages[+t.dataset.st], k = t.dataset.k;
    if (k === 'default') { if (t.checked) delete s.optional; else s.optional = true; }
    else if (k === 'assemblies') s.assemblies = t.value.split(',').map(x => x.trim()).filter(Boolean);
    else {
      s[k] = t.value;
      if (k === 'kind' && !['editmode', 'playmode'].includes(t.value)) delete s.assemblies;
      if (k === 'kind' && ['editmode', 'playmode'].includes(t.value) && !s.assemblies) s.assemblies = ['Framework.*'];
    }
  }
  if (e.type === 'change' && (t.tagName === 'SELECT' || t.type === 'checkbox')) return renderGate();
  ['saveGate', 'revertGate'].forEach(id => $('#' + id).disabled = same(g, S.state.gate));
}
async function onGateClick(e) {
  const t = e.target, g = S.gateDraft;
  const node = t.closest('[data-node]'); if (node) { S.stageSel = node.dataset.node; renderGate(); $('.stagecard.sel')?.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  if (t.dataset.del !== undefined) { g.stages.splice(+t.dataset.del, 1); return renderGate(); }
  if (t.id === 'addStage') { g.stages.push({ id: 'stage-' + (g.stages.length + 1), kind: 'editmode', title: 'New stage', assemblies: ['Framework.*'], optional: true }); return renderGate(); }
  if (t.id === 'revertGate') { S.gateDraft = clone(S.state.gate); return renderGate(); }
  if (t.id === 'saveGate') { try { await api('PUT', '/api/gate', g); toast('Gate saved'); await load(); } catch (err) { $('#gateErr').textContent = err.message; } }
}

// --- tests ------------------------------------------------------------------------------------

function renderTests() {
  const tests = S.state.catalog?.tests || [];
  if (!tests.length) { $('#view').innerHTML = '<div class="panel empty">No test catalog yet. Run the gate.</div>'; return; }
  const q = S.testQ.toLowerCase();
  const shown = tests.filter(t => !q || t.fullname.toLowerCase().includes(q) || (t.rules || []).some(r => r.toLowerCase().includes(q)));
  const tree = {};
  for (const t of shown) {
    const cls = t.fullname.endsWith('.' + t.name) ? t.fullname.slice(0, -t.name.length - 1) : t.fullname.split('.').slice(0, -1).join('.');
    (((tree[t.tier] ||= {})[t.assembly] ||= {})[cls] ||= []).push(t);
  }
  const flat = o => Object.values(o).flatMap(v => Array.isArray(v) ? v : flat(v));
  const stat = list => { const f = list.filter(t => t.result === 'Failed').length; return `<span class="dot ${f ? 'fail' : 'pass'}"></span><span class="faint">${list.length} test${list.length === 1 ? '' : 's'}${f ? ` · <span style="color:var(--fail)">${f} failed</span>` : ''}</span>`; };
  const open = q ? 'open' : '';
  const dot = t => t.result === 'Passed' ? 'pass' : t.result === 'Failed' ? 'fail' : '';
  const TIER = { rulebook: 'Rulebook', unit: 'Unit', acceptance: 'Acceptance', integration: 'Integration', playmode: 'PlayMode' };
  $('#view').innerHTML = `
    <div class="panel"><div class="pad">
      <div class="row between"><h2>Tests</h2><span class="muted">${tests.length} tests in the catalog · ${when(S.state.catalog.generatedAt)}</span></div>
      <div class="row" style="margin:12px 0"><input id="testQ" placeholder="Search test names or rule ids" value="${esc(S.testQ)}" style="max-width:420px"><span class="muted">${shown.length} shown</span></div>
      ${Object.entries(tree).sort().map(([tier, asms]) => `
        <details class="group" ${open}><summary><b>${TIER[tier] || tier}</b>${stat(flat(asms))}</summary>
          ${Object.entries(asms).sort().map(([asm, classes]) => `
            <details class="group" ${open}><summary><span class="mono">${esc(asm)}</span>${stat(flat(classes))}</summary>
              ${Object.entries(classes).sort().map(([cls, list]) => `
                <details class="group" ${open}><summary><span class="mono">${esc(cls.split('.').pop())}</span>${stat(list)}</summary>
                  ${list.map(t => `<div class="testrow"><span class="dot ${dot(t)}"></span><span>${esc(t.name)}</span>
                    <span>${(t.rules || []).map(ruleLink).join(' ')}</span><span class="faint mono">${Math.round((t.duration || 0) * 1000)} ms</span></div>`).join('')}
                </details>`).join('')}
            </details>`).join('')}
        </details>`).join('')}
    </div></div>`;
  const s = $('#testQ');
  s.addEventListener('input', () => { S.testQ = s.value; const pos = s.selectionStart; renderTests(); const n = $('#testQ'); n.focus(); n.setSelectionRange(pos, pos); });
}

// --- runs -------------------------------------------------------------------------------------

async function fetchRun(id) { if (!S.runCache[id]) S.runCache[id] = await api('GET', '/api/history/' + id); return S.runCache[id]; }

function renderRuns() {
  const h = S.state.history;
  if (!h.length) { $('#view').innerHTML = '<div class="panel empty">No runs yet. Use Run gate.</div>'; return; }
  const last = h.slice(0, 40).reverse(), max = Math.max(...last.map(r => r.durationSec || 1));
  const w = 100 / last.length;
  $('#view').innerHTML = `
    <div class="panel" style="margin-bottom:18px"><div class="pad" style="padding-bottom:0"><div class="row between"><h2>Runs</h2><span class="muted">Duration of the last ${last.length} runs, colored by result</span></div></div>
      <div class="chart"><svg viewBox="0 0 100 40" preserveAspectRatio="none" role="img" aria-label="Run durations">
        ${last.map((r, i) => { const hgt = Math.max(1.5, 36 * (r.durationSec || 0) / max); return `<rect data-run="${r.id}" x="${i * w + w * .15}" y="${40 - hgt}" width="${w * .7}" height="${hgt}" rx="0.6" fill="var(--${RES(r.result) || 'none'})" opacity="${r.id === S.runSel ? 1 : .55}" style="cursor:pointer"><title>${when(r.startedAt)} · ${r.result} · ${r.durationSec}s</title></rect>`; }).join('')}
      </svg></div></div>
    <div class="runs">
      <div class="panel" style="padding:8px">${h.map(r => `
        <div class="runitem ${r.id === S.runSel ? 'on' : ''}" data-run="${r.id}"><span class="dot ${RES(r.result)}"></span>
          <div><div>${when(r.startedAt)}</div><div class="faint" style="font-size:13px">${esc(runLabel(r.selection))}</div></div>
          <span class="faint mono">${r.durationSec}s</span></div>`).join('')}</div>
      <div class="panel" id="runDetail"><div class="empty">Loading…</div></div>
    </div>`;
  if (S.runSel) fetchRun(S.runSel).then(rep => { if (S.tab === 'runs') $('#runDetail').innerHTML = runDetail(rep); });
}
function runLabel(sel) {
  if (!sel) return '';
  if (sel.rule) return 'Rule ' + sel.rule;
  const bits = [];
  if (sel.all) bits.push('all stages');
  if (sel.only?.length) bits.push('only ' + sel.only.join(', '));
  if (sel.with?.length) bits.push('+ ' + sel.with.join(', '));
  if (sel.skip?.length) bits.push('skip ' + sel.skip.join(', '));
  return bits.join(' · ') || 'default stages';
}
function runDetail(r) {
  const byStage = {}; (r.failures || []).forEach(f => (byStage[f.stage] ||= []).push(f));
  const judges = Object.fromEntries((r.rules || []).filter(x => x.judge).map(x => [x.rule, x.judge]));
  return `<div class="pad">
    <div class="row between"><h2><span class="dot ${RES(r.result)}" style="margin-right:8px"></span>Gate ${esc(r.result)}</h2><span class="muted">${when(r.startedAt)} · ${r.durationSec}s · ${esc(runLabel(r.selection))}</span></div>
    <h3>Stages</h3><table><thead><tr><th>Stage</th><th>Kind</th><th>Result</th><th>Passed</th><th>Failed</th><th>Warned</th><th>Skipped</th></tr></thead><tbody>
      ${r.stages.filter(s => s.enabled || s.result !== 'SKIP').map(s => `<tr><td class="mono">${esc(s.id)}</td><td>${STAGE_KIND[s.kind] || s.kind}</td><td><span class="badge ${RES(s.result)}">${esc(s.result)}</span></td><td>${s.passed}</td><td>${s.failed - (s.warned || 0)}</td><td>${s.warned || 0}</td><td>${s.skipped}</td></tr>`).join('')}
    </tbody></table>
    ${(r.infraErrors || []).map(e => `<h3>Error</h3><div class="finding"><div>${esc(e)}</div></div>`).join('')}
    ${r.compileErrors?.length ? `<h3>Compile errors (${r.compileErrors.length})</h3>${r.compileErrors.map(c => finding({ target: `${c.file}:${c.line} ${c.code}`, detail: c.message }, '')).join('')}` : ''}
    ${Object.entries(byStage).map(([stage, list]) => `<h3>${esc(stage)} · ${list.length} failure(s)</h3>${list.map(f => `
      <div class="section">
        <div class="row between"><span class="mono" style="overflow-wrap:anywhere">${esc(f.test)}</span><div class="row">${(f.rules || []).map(ruleLink).join(' ')}<span class="badge ${f.severity === 'advisory' ? 'warn' : 'fail'}">${esc(f.severity || 'blocking')}</span></div></div>
        ${(f.rules || []).map(id => judges[id]).filter(Boolean).map(j => `<div class="help">Agent ${esc(j.model)} · ${j.turns ?? '?'} turns · ${j.durationSec}s${j.costUsd != null ? ' · $' + j.costUsd.toFixed(3) : ''}</div>`).join('')}
        <div style="margin-top:8px">${f.violations?.length ? f.violations.map(v => finding(v, f.severity === 'advisory' ? 'warn' : '')).join('') : `<pre class="mono" style="white-space:pre-wrap;margin:0">${esc(f.message)}</pre>`}</div>
        ${f.fix ? `<div class="fix"><b>Fix</b> ${esc(f.fix)}</div>` : ''}
      </div>`).join('')}`).join('')}
    ${!(r.failures || []).length && !(r.compileErrors || []).length ? '<h3>Failures</h3><div class="muted">None.</div>' : ''}
    <details style="margin-top:16px"><summary class="muted">Raw report.json</summary><pre class="mono" style="white-space:pre-wrap">${esc(JSON.stringify(r, null, 2))}</pre></details>
  </div>`;
}
function onRunsClick(e) { const el = e.target.closest('[data-run]'); if (el) { S.runSel = el.dataset.run; renderRuns(); } }

// --- event routing ----------------------------------------------------------------------------

$('#view').addEventListener('input', e => { if (S.tab === 'rules') onRulesInput(e); if (S.tab === 'template') onTemplate(e); if (S.tab === 'gate') onGate(e); });
$('#view').addEventListener('change', e => { if (S.tab === 'rules') onRulesChange(e); if (S.tab === 'template') onTemplate(e); if (S.tab === 'gate') onGate(e); });
$('#view').addEventListener('click', e => { if (S.tab === 'rules') onRulesClick(e); if (S.tab === 'template') onTemplateClick(e); if (S.tab === 'gate') onGateClick(e); if (S.tab === 'runs') onRunsClick(e); });

// --- runs: start, poll, output ----------------------------------------------------------------

let polling = null;
async function startRun(body) {
  try { renderRun(await api('POST', '/api/run', body)); $('#runbar').classList.remove('closed'); poll(); } catch (err) { toast(err.message); }
}
function poll() {
  clearInterval(polling);
  polling = setInterval(async () => {
    const st = await api('GET', '/api/run'); renderRun(st);
    if (!st.running) {
      clearInterval(polling); polling = null; S.runCache = {}; S.runSel = null; await load();
      toast(st.exitCode === 0 ? 'Gate finished' : 'Gate failed'); if (st.exitCode === 0) $('#runbar').classList.add('closed');
    }
  }, 1000);
}
function renderRun(st) {
  if (!st) return;
  $('#runDot').className = 'dot' + (st.running ? ' run' : '');
  $('#runTitle').textContent = st.running ? 'Gate running' : st.startedAt ? `Gate finished (exit ${st.exitCode})` : 'No run yet';
  $('#runMeta').textContent = st.args?.length ? st.args.join(' ') : '';
  $('#runStop').hidden = !st.running;
  $('#runDefault').disabled = $('#runMore').disabled = st.running;
  const out = $('#runOut'), atEnd = out.scrollTop + out.clientHeight >= out.scrollHeight - 4;
  out.textContent = (st.output || []).join('\n'); if (atEnd) out.scrollTop = out.scrollHeight;
  if (st.running && !polling) poll();
}
$('#runHead').addEventListener('click', e => { if (e.target.id !== 'runStop') $('#runbar').classList.toggle('closed'); });
$('#runStop').addEventListener('click', async () => { await api('POST', '/api/run/stop'); toast('Stopping'); });
$('#runDefault').addEventListener('click', () => startRun({}));
$('#runMore').addEventListener('change', e => {
  const v = e.target.value; e.target.value = '';
  ({ playmode: () => startRun({ with: ['playmode'] }), review: () => startRun({ with: ['review'] }),
     onlyreview: () => startRun({ only: ['review'] }), all: () => startRun({ all: true }) })[v]?.();
});

load().catch(err => { $('#view').innerHTML = `<div class="panel pad errors">${esc(err.message)}</div>`; });
</script>
</body>

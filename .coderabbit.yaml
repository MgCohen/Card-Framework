# CodeRabbit configuration. Schema: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: >-
  Be short and direct. Give each finding with the file, the rule it breaks and one fix.
  Do not praise. Do not restate the diff.

reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  sequence_diagrams: true
  auto_review:
    enabled: true
    drafts: false
    # Stacked PRs target the branch they were cut from, not only main.
    base_branches:
      - ".*"

  # Unity-generated and third-party files. Do not review them.
  path_filters:
    - "!**/*.meta"
    - "!Library/**"
    - "!Logs/**"
    - "!Temp/**"
    - "!UserSettings/**"
    - "!ProjectSettings/**"
    - "!Packages/packages-lock.json"
    - "!Assets/TextMesh Pro/**"
    - "!Assets/Settings/**"
    - "!Assets/Scenes/**"
    - "!**/*.unity"
    - "!**/*.prefab"
    - "!**/*.asset"
    - "!**/*.inputactions"

  path_instructions:
    - path: "Source/**"
      instructions: |
        .NET code in the VSA shape. It runs with no Unity. Read CLAUDE.md and docs/.
        Examine these rules:
        - Only Plugins/Ecs references Friflo.Engine.ECS. Other code uses Entity, EntityId and IWorldReader.
        - Only the primitive handlers in Plugins/Ecs write the World. No cast from a reader to a writer.
        - Flag a package source in a project file, NoWarn, or TreatWarningsAsErrors set to false.
        - Flag WarningsNotAsErrors, MSBuildWarningsNotAsErrors, LangVersion, severity = none, [Ignore] and [Explicit].
        - Flag a new Directory.Build.props or Directory.Build.targets. Source/Directory.Build.props is the only one.
        - Each *.csproj under Source/ must be in CardFramework.slnx.
        - Comments warn about what the code does not show. Flag comments that narrate the code.
    - path: "{global.json,nuget.config,CardFramework.slnx}"
      instructions: |
        These files set the SDK, the VSA version, the package feeds and the projects that build. Flag each change.
    - path: "Assets/**/*.cs"
      instructions: |
        Unity client code. Gameplay logic goes in Source/ modules, not in Assets/.
        Prefer small changes. Flag unrelated refactors.
    - path: "docs/**/*.md"
      instructions: |
        Docs must agree with the code. Flag statements that the diff makes false.
    - path: "Packages/manifest.json"
      instructions: |
        Flag new third-party dependencies.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "docs/*.md"
  learnings:
    scope: auto

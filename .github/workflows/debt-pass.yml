name: Auto debt-pass

# Threshold-driven discharge of `Product/ledgers/ALIGNMENT-DEBT.md`. Runs the
# threshold check on every merge to main as a fail-safe backstop; the expensive
# Claude action only fires when ≥5 entries are open. The unattended agent edits
# docs, opens a PR, and stops — human review at the PR is the only gate. See
# PLANS/auto-debt-pass.md for the full spec.
#
# Two-job design: `threshold` fires on merged PRs and dispatches a fresh
# `workflow_dispatch` event when the count is over the limit. `debt-pass` listens
# only on `workflow_dispatch` so the Claude action always runs in that context —
# running it under `pull_request` caused the action to enter PR-assistant mode on
# the already-merged PR and exit immediately without doing any work.
#
# No `paths:` filter on the threshold job: if the workflow ever crashes or is
# misconfigured, debt accumulates silently and a path filter would gate recovery
# on someone touching the ledger again. Running the check on every merge means
# the system self-corrects on the next PR. The check is sub-second.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  threshold:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Threshold check
        run: |
          # Threshold counts only cascade entries (open entries NOT from linter).
          # Linter findings (source: linter or source: linter/archive) are
          # mechanical link-cleanup; they get discharged in the same pass when
          # cascade tips the threshold, but they never trigger a pass on their
          # own. See Product/_workflow/PRODUCT-BUILDER.md §5.8 / §5.10.
          cascade_count=$(grep '| status: open |' Product/ledgers/ALIGNMENT-DEBT.md 2>/dev/null \
            | grep -vc 'source: linter' || true)
          cascade_count=${cascade_count:-0}
          total_count=$(grep -c '| status: open |' Product/ledgers/ALIGNMENT-DEBT.md || true)
          total_count=${total_count:-0}
          if [ "$cascade_count" -ge 5 ]; then
            echo "Threshold tripped: $cascade_count cascade entries (>= 5; total open: $total_count). Dispatching debt-pass."
            gh workflow run debt-pass.yml
          else
            echo "Below threshold: $cascade_count cascade entries (< 5; total open: $total_count). Skipping."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  debt-pass:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Run debt-pass
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_THINKING_TOKENS: "4000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/builder:debt-pass"
          allowed_bots: '*'
          show_full_output: true
          claude_args: |
            --max-turns 60
            --model claude-haiku-4-5-20251001
